# -- Override the chart name
nameOverride: ""
# -- Override the fully-qualified app name
fullnameOverride: ""

sv:
  # -- Shared secret key used for: RustFS password, S3 secret, and filesystem HMAC signing.
  # Leave empty to auto-generate on first install (recommended).
  # Override sv.core.externalS3.secretKey separately if using external S3 with its own credentials.
  secretKey: ""

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image:
      repository: postgres
      tag: "18.3"
      pullPolicy: IfNotPresent
    # -- Database name for the core service
    database: streamvault_core
    # -- PostgreSQL superuser username (used only for init; not exposed to the application)
    username: streamvault
    # -- PostgreSQL superuser password; leave empty to auto-generate on first install.
    # Retrieve with: kubectl get secret <release>-streamvault-secrets -o jsonpath='{.data.postgres-password}' | base64 -d
    password: ""
    # -- Password for streamvault_migrator (Flyway DDL user); auto-generated if empty.
    migratorPassword: ""
    # -- Password for streamvault_core (Hibernate Reactive DML user); auto-generated if empty.
    appPassword: ""
    # -- PVC size for the postgres data directory
    storage: 10Gi
    # -- StorageClass name; leave empty to use the cluster default
    storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # ── Kafka (KRaft, no Zookeeper) ────────────────────────────────────────────
  kafka:
    image:
      repository: apache/kafka
      tag: "4.2.0"
      pullPolicy: IfNotPresent
    # -- Broker/controller node ID
    nodeId: 1
    # -- PVC size for Kafka data
    storage: 10Gi
    # -- StorageClass name; leave empty to use the cluster default
    storageClass: ""
    clusterId: "-T-Nd9zZRx-fSI2-fRXetw"
    topics:
      - name: media.uploaded
        partitions: 3
        replicationFactor: 1
      - name: media.transcoded
        partitions: 3
        replicationFactor: 1
      - name: media.metadata-ready
        partitions: 3
        replicationFactor: 1
      - name: watch.sync-requested
        partitions: 3
        replicationFactor: 1
      - name: watch.sync-ready
        partitions: 3
        replicationFactor: 1
      - name: scrobble.events
        partitions: 6
        replicationFactor: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image:
      repository: redis
      tag: "8.6.2-alpine"
      pullPolicy: IfNotPresent
    # -- Redis AUTH password; leave empty to auto-generate on first install.
    password: ""
    # -- PVC size for Redis AOF/RDB data
    storage: 2Gi
    # -- StorageClass name; leave empty to use the cluster default
    storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # ── Envoy (edge gateway) ────────────────────────────────────────────────────
  envoy:
    image:
      repository: envoyproxy/envoy
      tag: "v1.38.0"
      pullPolicy: IfNotPresent
    # -- Number of Envoy replicas
    replicas: 1
    service:
      # -- Service type: LoadBalancer for cloud, NodePort for bare-metal
      type: LoadBalancer
      # -- HTTP port
      httpPort: 18080
      # -- HTTPS port
      httpsPort: 18443
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  # ── Core service ────────────────────────────────────────────────────────────
  core:
    image:
      repository: ghcr.io/streamvault-platform/core
      tag: "0.1.0-dev"
      pullPolicy: Always # TODO: change if tags change to stable releases
    # -- Number of replicas
    replicas: 1
    # -- Health check path exposed by the app; must return 200 when ready
    healthPath: /health
    # -- Allow anyone to register a new account without an invite link.
    openRegistration: false
    # -- Default invite link expiry in days. 0 = links never expire.
    inviteDefaultExpiryDays: 7
    # -- Storage backend for media files. Options: s3 | filesystem
    storageBackend: s3
    jwtStorageClass: "" # -- StorageClass for JWT keys PVC; leave empty to use cluster default
    # -- PVC size for media files (filesystem backend only)
    mediaStorage: 20Gi
    # -- StorageClass for media PVC; leave empty to use cluster default
    mediaStorageClass: ""
    # -- External S3 (AWS S3, Backblaze B2, etc.) — leave disabled to use embedded RustFS
    externalS3:
      enabled: false
      # -- S3 endpoint override; leave empty for real AWS S3, set for other S3-compatible services
      endpoint: ""
      # -- Access key; leave empty to use IRSA / instance profile on EKS
      accessKey: ""
      # -- Secret key; leave empty to use IRSA / instance profile on EKS
      secretKey: ""
      bucket: "streamvault-media"
      region: "us-east-1"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  # ── Web client ──────────────────────────────────────────────────────────────
  web:
    image:
      repository: ghcr.io/streamvault-platform/web
      tag: "0.1.0-dev"
      pullPolicy: Always
    # -- Number of replicas
    replicas: 1
    # -- API URL injected at container startup. Only needed for split deployments
    # where web and backend run on different servers. Leave empty when deploying
    # the full stack together.
    apiUrl: ""
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 64Mi

  # ── Pipeline service ────────────────────────────────────────────────────────
  pipeline:
    image:
      repository: ghcr.io/streamvault-platform/pipeline
      tag: "0.1.0-dev"
      pullPolicy: Always # TODO: change if tags change to stable releases
    # -- Number of replicas
    replicas: 1
    # -- HTTP port the JVM listens on (injected as SERVER_PORT)
    port: 8080
    # -- Health check path exposed by the app; must return 200 when ready
    healthPath: /health
    # -- Kafka consumer group ID
    consumerGroup: "streamvault-pipeline"
    # -- Prometheus scrape interval for metrics endpoint
    metricsInterval: "15 seconds"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi

  # ── RustFS (S3-compatible object storage) ──────────────────────────────────
  rustfs:
    image:
      repository: rustfs/rustfs
      tag: "1.0.0-beta.1"
      pullPolicy: IfNotPresent
    # -- S3 API port
    port: 9000
    # -- Web console port
    consolePort: 9001
    # -- S3 API access key (username)
    accessKey: "rustfsadmin"
    # -- S3 API secret key (password); leave empty — driven by sv.secretKey.
    secretKey: ""
    # -- Default bucket created for media storage
    bucket: streamvault-media
    # -- S3 region reported to clients
    region: us-east-1
    # -- PVC size for rustfs data directory
    storage: 50Gi
    # -- StorageClass name; leave empty to use the cluster default
    storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # ── Observability (opt-in) ──────────────────────────────────────────────────
  observability:
    # -- Set to true to deploy Prometheus + Grafana alongside the platform
    enabled: false

    prometheus:
      image:
        repository: prom/prometheus
        tag: "v3.11.3"
        pullPolicy: IfNotPresent
      # -- TSDB retention period
      retention: 15d
      # -- PVC size for Prometheus data
      storage: 20Gi
      # -- StorageClass name; leave empty to use the cluster default
      storageClass: ""
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi

    kafkaUi:
      # -- Set to true to deploy Kafka UI alongside the platform
      enabled: false
      image:
        repository: provectuslabs/kafka-ui
        tag: "v0.7.2"
        pullPolicy: IfNotPresent
      service:
        # -- Service type for Kafka UI access
        type: ClusterIP
        port: 8080
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    grafana:
      image:
        repository: grafana/grafana
        tag: "13.0.1"
        pullPolicy: IfNotPresent
      # -- Grafana admin username
      adminUser: admin
      # -- Grafana admin password (required when observability.enabled=true)
      adminPassword: ""
      # -- PVC size for Grafana data
      storage: 5Gi
      # -- StorageClass name; leave empty to use the cluster default
      storageClass: ""
      service:
        # -- Service type for Grafana UI access
        type: ClusterIP
        port: 3000
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
