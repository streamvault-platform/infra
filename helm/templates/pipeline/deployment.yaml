apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamvault.fullname" . }}-pipeline
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: pipeline
spec:
  replicas: {{ .Values.sv.pipeline.replicas }}
  selector:
    matchLabels:
      {{- include "streamvault.componentSelectorLabels" (list . "pipeline") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "streamvault.componentSelectorLabels" (list . "pipeline") | nindent 8 }}
    spec:
      containers:
        - name: pipeline
          image: "{{ .Values.sv.pipeline.image.repository }}:{{ .Values.sv.pipeline.image.tag }}"
          imagePullPolicy: {{ .Values.sv.pipeline.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.sv.pipeline.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.sv.pipeline.port | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ include "streamvault.fullname" . }}-kafka:9092"
            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.sv.pipeline.consumerGroup | quote }}
            - name: METRICS_INTERVAL
              value: {{ .Values.sv.pipeline.metricsInterval | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.sv.pipeline.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.sv.pipeline.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.sv.pipeline.resources | nindent 12 }}
