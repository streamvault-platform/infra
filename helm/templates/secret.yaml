apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streamvault.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ required "sv.postgres.password is required" .Values.sv.postgres.password | b64enc | quote }}
  redis-password: {{ required "sv.redis.password is required" .Values.sv.redis.password | b64enc | quote }}
  rustfs-secret-key: {{ required "sv.rustfs.secretKey is required" .Values.sv.rustfs.secretKey | b64enc | quote }}
{{- if .Values.sv.observability.enabled }}
  grafana-admin-password: {{ required "sv.observability.grafana.adminPassword is required when observability is enabled" .Values.sv.observability.grafana.adminPassword | b64enc | quote }}
{{- end }}