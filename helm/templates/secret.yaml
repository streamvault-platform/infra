{{- /*
  JWT key pair: generated once on first install, reused on every upgrade.
  lookup checks if the secret already exists to avoid key rotation on helm upgrade.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "streamvault.secretName" .) }}
{{- $jwtPrivateKey := "" }}
{{- $jwtCert := "" }}
{{- if $existing }}
{{- $jwtPrivateKey = index $existing.data "jwt-private-key" }}
{{- $jwtCert = index $existing.data "jwt-cert" }}
{{- else }}
{{- $ca := genSelfSignedCert "streamvault" nil nil 3650 }}
{{- $jwtPrivateKey = $ca.Key | b64enc }}
{{- $jwtCert = $ca.Cert | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "streamvault.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ required "sv.postgres.password is required" .Values.sv.postgres.password | b64enc | quote }}
  redis-password: {{ required "sv.redis.password is required" .Values.sv.redis.password | b64enc | quote }}
  kafka-cluster-id: {{ required "sv.kafka.clusterId is required" .Values.sv.kafka.clusterId | b64enc | quote }}
  jwt-private-key: {{ $jwtPrivateKey | quote }}
  jwt-cert: {{ $jwtCert | quote }}
{{- if .Values.sv.observability.enabled }}
  grafana-admin-password: {{ required "sv.observability.grafana.adminPassword is required when observability is enabled" .Values.sv.observability.grafana.adminPassword | b64enc | quote }}
{{- end }}
