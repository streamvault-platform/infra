apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamvault.fullname" . }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "streamvault.componentSelectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
