apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamvault.fullname" . }}-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
      protocol: TCP
    - name: controller
      port: 9093
      targetPort: controller
      protocol: TCP
  selector:
    {{- include "streamvault.componentSelectorLabels" (list . "kafka") | nindent 4 }}
