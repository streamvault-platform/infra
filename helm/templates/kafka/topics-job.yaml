apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "streamvault.fullname" . }}-kafka-topics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-topics
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "streamvault.componentSelectorLabels" (list . "kafka-topics") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: "{{ .Values.sv.kafka.image.repository }}:{{ .Values.sv.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.sv.kafka.image.pullPolicy }}
          command: ["/bin/bash", "/scripts/create-topics.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: {{ include "streamvault.fullname" . }}-kafka-topics
            defaultMode: 0755
