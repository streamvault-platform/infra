apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "streamvault.fullname" . }}-kafka-topics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
data:
  create-topics.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    BOOTSTRAP="{{ include "streamvault.fullname" . }}-kafka:9092"

    echo "Waiting for Kafka at ${BOOTSTRAP}..."
    until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "${BOOTSTRAP}" &>/dev/null; do
      sleep 2
    done
    echo "Kafka is ready."

    {{- range .Values.sv.kafka.topics }}
    if /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --list | grep -qx {{ .name | quote }}; then
      echo "Topic already exists: {{ .name }}"
    else
      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server "${BOOTSTRAP}" \
        --create \
        --topic {{ .name | quote }} \
        --partitions {{ .partitions }} \
        --replication-factor {{ .replicationFactor }}
      echo "Created: {{ .name }} (partitions={{ .partitions }}, replication={{ .replicationFactor }})"
    fi
    {{- end }}

    echo "All topics ready."
