apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamvault.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "streamvault.componentSelectorLabels" (list . "redis") | nindent 4 }}
