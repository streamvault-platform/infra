apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streamvault.fullname" . }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  replicas: {{ .Values.sv.core.replicas }}
  selector:
    matchLabels:
      {{- include "streamvault.componentSelectorLabels" (list . "core") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "streamvault.componentSelectorLabels" (list . "core") | nindent 8 }}
    spec:
      # TODO: CronJob for periodic JWT key rotation, with initContainer to copy new keys to the main container on startup
      initContainers:
        - name: jwt-keygen
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              if [ ! -f /jwt/private.pem ]; then
                apk add --no-cache openssl
                openssl genrsa -out /jwt/private.pem 2048
                openssl req -new -x509 -key /jwt/private.pem -out /jwt/cert.pem \
                  -days 3650 -subj '/CN=streamvault'
                chown 185:185 /jwt/private.pem /jwt/cert.pem
                chmod 400 /jwt/private.pem
                chmod 444 /jwt/cert.pem
                echo 'JWT key pair generated'
              else
                echo 'JWT key pair already exists, skipping'
              fi
          volumeMounts:
            - name: jwt-keys
              mountPath: /jwt
      containers:
        - name: core
          image: "{{ .Values.sv.core.image.repository }}:{{ .Values.sv.core.image.tag }}"
          imagePullPolicy: {{ .Values.sv.core.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUARKUS_DATASOURCE_USERNAME
              value: "{{ .Values.sv.postgres.username }}"
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamvault.secretName" . }}
                  key: postgres-password
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: "postgresql://{{ include "streamvault.fullname" . }}-postgres:5432/{{ .Values.sv.postgres.database }}"
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://{{ include "streamvault.fullname" . }}-postgres:5432/{{ .Values.sv.postgres.database }}"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ include "streamvault.fullname" . }}-kafka:9092"
            - name: STREAMVAULT_AUTH_JWT_PRIVATE_KEY_LOCATION
              value: /jwt/private.pem
            - name: STREAMVAULT_AUTH_JWT_PUBLIC_KEY_LOCATION
              value: /jwt/cert.pem
            {{- if .Values.sv.core.externalS3.enabled }}
            {{- if .Values.sv.core.externalS3.endpoint }}
            - name: STREAMVAULT_S3_ENDPOINT
              value: {{ .Values.sv.core.externalS3.endpoint | quote }}
            {{- end }}
            {{- if .Values.sv.core.externalS3.accessKey }}
            - name: STREAMVAULT_S3_ACCESS_KEY
              value: {{ .Values.sv.core.externalS3.accessKey | quote }}
            - name: STREAMVAULT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamvault.secretName" . }}
                  {{- if .Values.sv.core.externalS3.secretKey }}
                  key: external-s3-secret-key
                  {{- else }}
                  key: secret-key
                  {{- end }}
            {{- end }}
            - name: STREAMVAULT_S3_BUCKET
              value: {{ .Values.sv.core.externalS3.bucket | quote }}
            - name: STREAMVAULT_S3_REGION
              value: {{ .Values.sv.core.externalS3.region | quote }}
            {{- else }}
            - name: STREAMVAULT_S3_ENDPOINT
              value: "http://{{ include "streamvault.fullname" . }}-rustfs:{{ .Values.sv.rustfs.port }}"
            - name: STREAMVAULT_S3_ACCESS_KEY
              value: {{ .Values.sv.rustfs.accessKey | quote }}
            - name: STREAMVAULT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamvault.secretName" . }}
                  key: secret-key
            - name: STREAMVAULT_S3_BUCKET
              value: {{ .Values.sv.rustfs.bucket | quote }}
            - name: STREAMVAULT_S3_REGION
              value: {{ .Values.sv.rustfs.region | quote }}
            {{- end }}
            - name: STREAMVAULT_STORAGE_BACKEND
              value: {{ .Values.sv.core.storageBackend | quote }}
            - name: STREAMVAULT_MEDIA_PATH
              value: {{ .Values.sv.core.mediaPath | default "/var/streamvault/media" | quote }}
            - name: STREAMVAULT_INTERNAL_BASE_URL
              value: "http://{{ include "streamvault.fullname" . }}-core:8080"
            - name: STREAMVAULT_INTERNAL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamvault.secretName" . }}
                  key: secret-key
            - name: QUARKUS_REDIS_HOSTS
              value: "redis://{{ include "streamvault.fullname" . }}-redis:6379"
            - name: QUARKUS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "streamvault.secretName" . }}
                  key: redis-password
          volumeMounts:
            - name: jwt-keys
              mountPath: /jwt
              readOnly: true
            {{- if eq .Values.sv.core.storageBackend "filesystem" }}
            - name: media
              mountPath: {{ .Values.sv.core.mediaPath | default "/var/streamvault/media" }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.sv.core.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.sv.core.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.sv.core.resources | nindent 12 }}
      volumes:
        - name: jwt-keys
          persistentVolumeClaim:
            claimName: {{ include "streamvault.fullname" . }}-jwt-keys
        {{- if eq .Values.sv.core.storageBackend "filesystem" }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "streamvault.fullname" . }}-media
        {{- end }}