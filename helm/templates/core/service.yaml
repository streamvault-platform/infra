apiVersion: v1
kind: Service
metadata:
  name: {{ include "streamvault.fullname" . }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "streamvault.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "streamvault.componentSelectorLabels" (list . "core") | nindent 4 }}
