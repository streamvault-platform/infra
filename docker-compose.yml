networks:
  streamvault-net:
    driver: bridge

volumes:
  core_data:
  kafka_data:
  redis_data:
  jwt_keys:
  rustfs_data:

services:

  streamvault-postgres:
    image: postgres:18.3
    profiles: [ standard, full ]
    restart: unless-stopped
    networks: [ streamvault-net ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-streamvault_core}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
    volumes:
      - core_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-streamvault} -d
            ${POSTGRES_DB:-streamvault_core}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  streamvault-kafka:
    image: apache/kafka:4.2.0
    profiles: [ standard, full ]
    restart: unless-stopped
    networks: [ streamvault-net ]
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://streamvault-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID:-1}@streamvault-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID is required}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server
            localhost:9092",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  streamvault-kafka-init:
    image: apache/kafka:4.2.0
    profiles: [ standard, full ]
    restart: "no"
    networks: [ streamvault-net ]
    depends_on:
      streamvault-kafka:
        condition: service_healthy
    volumes:
      - ./kafka-topics.sh:/scripts/kafka-topics.sh:ro
    command: [ "/bin/bash", "/scripts/kafka-topics.sh" ]

  streamvault-jwt-init:
    image: alpine:3.20
    profiles: [ standard, full ]
    restart: "no"
    networks: [ streamvault-net ]
    volumes:
      - jwt_keys:/jwt
    command:
      - sh
      - -c
      - |
        if [ ! -f /jwt/private.pem ]; then
          apk add --no-cache openssl
          openssl genrsa -out /jwt/private.pem 2048
          openssl req -new -x509 -key /jwt/private.pem -out /jwt/cert.pem -days 3650 -subj '/CN=streamvault'
          chown 185:185 /jwt/private.pem /jwt/cert.pem
          chmod 400 /jwt/private.pem
          chmod 444 /jwt/cert.pem
          echo 'JWT key pair generated'
        else
          echo 'JWT key pair already exists, skipping'
        fi

  streamvault-redis:
    image: redis:8.6.2-alpine
    profiles: [ standard, full ]
    restart: unless-stopped
    networks: [ streamvault-net ]
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  streamvault-rustfs:
    image: rustfs/rustfs:1.0.0-beta.1
    profiles: [ standard, full ]
    restart: unless-stopped
    networks: [ streamvault-net ]
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STREAMVAULT_SECRET_KEY:?STREAMVAULT_SECRET_KEY is required}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "nc -z -w 1 localhost 9000" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  streamvault-rustfs-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    profiles: [ standard, full ]
    restart: "no"
    networks: [ streamvault-net ]
    depends_on:
      streamvault-rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STREAMVAULT_SECRET_KEY:?STREAMVAULT_SECRET_KEY is required}
      RUSTFS_BUCKET: ${STREAMVAULT_S3_BUCKET:-streamvault-media}
    entrypoint: >
      sh -c "
        mc alias set rustfs http://streamvault-rustfs:9000 $$RUSTFS_ACCESS_KEY $$RUSTFS_SECRET_KEY &&
        mc mb --ignore-existing rustfs/$$RUSTFS_BUCKET
      "

  streamvault-envoy:
    image: envoyproxy/envoy:v1.38.0
    profiles: [ standard, full ]
    restart: unless-stopped
    networks: [ streamvault-net ]
    ports:
      - "${ENVOY_HTTP_PORT:-18080}:8080"
      - "${ENVOY_HTTPS_PORT:-18443}:8443"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      streamvault-core:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9901'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  streamvault-core:
    image: ${CORE_IMAGE:-ghcr.io/streamvault-platform/core:0.1.0-dev}
    profiles: [ standard, full ]
    restart: unless-stopped
    networks: [ streamvault-net ]
    depends_on:
      streamvault-postgres:
        condition: service_healthy
      streamvault-kafka:
        condition: service_healthy
      streamvault-redis:
        condition: service_healthy
      streamvault-jwt-init:
        condition: service_completed_successfully
      streamvault-rustfs:
        condition: service_healthy
      streamvault-kafka-init:
        condition: service_completed_successfully
    volumes:
      - jwt_keys:/jwt:ro
    environment:
      CORE_DATASOURCE_REACTIVE_URL: postgresql://streamvault-postgres:5432/${POSTGRES_DB:-streamvault_core}
      CORE_DATASOURCE_USERNAME: streamvault_core
      CORE_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      CORE_DATASOURCE_JDBC_URL: jdbc:postgresql://streamvault-postgres:5432/${POSTGRES_DB:-streamvault_core}
      CORE_FLYWAY_USERNAME: streamvault_migrator
      CORE_FLYWAY_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: streamvault-kafka:9092
      STREAMVAULT_AUTH_JWT_PRIVATE_KEY_LOCATION: /jwt/private.pem
      STREAMVAULT_AUTH_JWT_PUBLIC_KEY_LOCATION: /jwt/cert.pem
      STREAMVAULT_S3_ENDPOINT: ${STREAMVAULT_S3_ENDPOINT:-http://streamvault-rustfs:9000}
      STREAMVAULT_S3_ACCESS_KEY: ${STREAMVAULT_S3_ACCESS_KEY:-rustfsadmin}
      STREAMVAULT_S3_SECRET_KEY: ${STREAMVAULT_S3_SECRET_KEY:-${STREAMVAULT_SECRET_KEY}}
      STREAMVAULT_S3_BUCKET: ${STREAMVAULT_S3_BUCKET:-streamvault-media}
      STREAMVAULT_S3_REGION: ${STREAMVAULT_S3_REGION:-us-east-1}
      STREAMVAULT_STORAGE_BACKEND: ${STREAMVAULT_STORAGE_BACKEND:-s3}
      STREAMVAULT_MEDIA_PATH: ${STREAMVAULT_MEDIA_PATH:-/var/streamvault/media}
      STREAMVAULT_INTERNAL_BASE_URL: ${STREAMVAULT_INTERNAL_BASE_URL:-http://streamvault-core:8080}
      STREAMVAULT_INTERNAL_SIGNING_SECRET: ${STREAMVAULT_INTERNAL_SIGNING_SECRET:-${STREAMVAULT_SECRET_KEY}}
      CORE_REDIS_HOSTS: redis://streamvault-redis:6379
      CORE_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  streamvault-web:
    image: ${WEB_IMAGE:-ghcr.io/streamvault-platform/web:0.1.0-dev}
    profiles: [ standard, full ]
    restart: unless-stopped
    networks: [ streamvault-net ]
    depends_on:
      streamvault-envoy:
        condition: service_healthy
    environment:
      STREAMVAULT_API_URL: ${STREAMVAULT_API_URL:-}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  streamvault-pipeline:
    image: ${PIPELINE_IMAGE:-ghcr.io/streamvault-platform/pipeline:0.1.0-dev}
    profiles: [ standard, full ]
    restart: unless-stopped
    networks: [ streamvault-net ]
    depends_on:
      streamvault-kafka:
        condition: service_healthy
      streamvault-kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: streamvault-kafka:9092
      KAFKA_CONSUMER_GROUP: ${PIPELINE_CONSUMER_GROUP:-streamvault-pipeline}
      METRICS_INTERVAL: ${PIPELINE_METRICS_INTERVAL:-15 seconds}
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
