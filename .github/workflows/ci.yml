name: CI / CD

on:
  pull_request:
  push:
    branches: [develop, release]
    tags: ['v*']

jobs:
  # ── Tests (every PR and push) ─────────────────────────────────────────────
  helm-test:
    name: Helm lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5
        with:
          version: '3.14.0'

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Lint (standard)
        run: helm lint ./helm

      - name: Lint (with observability)
        run: helm lint ./helm --set sv.observability.enabled=true

      - name: Validate rendered manifests (standard)
        run: helm template streamvault ./helm | kubeconform -strict -summary

      - name: Validate rendered manifests (with observability)
        run: |
          helm template streamvault ./helm \
            --set sv.observability.enabled=true \
          | kubeconform -strict -summary

  compose-test:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create .env
        run: |
          {
            echo "POSTGRES_PASSWORD=cipassword"
            echo "DB_MIGRATOR_PASSWORD=cipassword"
            echo "DB_APP_PASSWORD=cipassword"
            echo "REDIS_PASSWORD=cipassword"
            echo "KAFKA_CLUSTER_ID=$(python3 -c 'import uuid; print(uuid.uuid4())')"
            echo "GF_SECURITY_ADMIN_PASSWORD=cipassword"
            echo "STREAMVAULT_SECRET_KEY=cipassword"
          } > .env

      - name: Validate standard profile
        run: docker compose --profile standard config --quiet

      - name: Validate full profile
        run: docker compose --profile full config --quiet

  # ── Publish dev (develop → GHCR, floating tag) ───────────────────────────
  publish-dev:
    name: Publish dev chart
    needs: [helm-test, compose-test]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5
        with:
          version: '3.14.0'

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Package and push dev chart
        run: |
          version=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          helm package --version "${version}-dev" ./helm
          helm push "streamvault-${version}-dev.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts

  # ── Publish RC (release branch → GHCR, auto-numbered) ────────────────────
  publish-rc:
    name: Publish RC chart
    needs: [helm-test, compose-test]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5
        with:
          version: '3.14.0'

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Package and push RC chart
        run: |
          version=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          rc_version="${version}-rc.${{ github.run_number }}"
          helm package --version "${rc_version}" ./helm
          helm push "streamvault-${rc_version}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts

  # ── Deploy RC (release branch → staging, placeholder) ────────────────────
  deploy-rc:
    name: Deploy RC
    needs: [publish-rc]
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # TODO: add kubeconfig setup and helm upgrade command for staging cluster
      - name: Deploy RC (placeholder)
        run: echo "Configure staging cluster credentials and run helm upgrade here"

  # ── Publish release (v* tag on main → GHCR) ──────────────────────────────
  publish:
    name: Publish versioned chart
    needs: [helm-test, compose-test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main \
            || { echo "Tag ${{ github.ref_name }} is not on main — aborting"; exit 1; }

      - uses: azure/setup-helm@v5
        with:
          version: '3.14.0'

      - name: Verify tag matches Chart.yaml version
        run: |
          chart_version=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$chart_version" != "$tag_version" ]; then
            echo "Tag ($tag_version) does not match helm/Chart.yaml version ($chart_version)"
            exit 1
          fi

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          version=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
          helm package ./helm
          helm push "streamvault-${version}.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}/charts

  # ── Deploy (release tag → placeholder) ───────────────────────────────────
  deploy:
    name: Deploy
    needs: [publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # TODO: add kubeconfig setup and helm upgrade command for target cluster
      - name: Deploy (placeholder)
        run: echo "Configure target cluster credentials and run helm upgrade here"
