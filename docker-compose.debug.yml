# Debug overlay — enables JDWP on core and builds all services from local source.
#
# Prerequisites (JAR must exist before docker compose build):
#   ../core/mvnw -f ../core/pom.xml package -DskipTests
#   (cd ../pipeline && sbt assembly)
# Note: web builds entirely within Docker — no prerequisite step needed.
#
# Usage:
#   cp .env.debug.example .env   # first time only
#   docker compose --profile standard \
#     -f docker-compose.yml \
#     -f docker-compose.override.yml \
#     -f docker-compose.debug.yml \
#     build
#   docker compose --profile standard \
#     -f docker-compose.yml \
#     -f docker-compose.override.yml \
#     -f docker-compose.debug.yml \
#     up -d
#
# Attach your IDE remote debugger to localhost:5005 (suspend=n).

services:
  streamvault-core:
    build:
      context: ../core
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "${DEBUG_PORT:-5005}:5005"
    environment:
      JAVA_DEBUG: "true"
      JAVA_DEBUG_PORT: "*:5005"

  streamvault-pipeline:
    build:
      context: ../pipeline
      dockerfile: Dockerfile
    ports:
      - "${PIPELINE_DEBUG_PORT:-5006}:5006"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"

  streamvault-web:
    build:
      context: ../web
      dockerfile: Dockerfile
